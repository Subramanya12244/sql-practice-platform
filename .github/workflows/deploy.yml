# Test, prerender and deploy the public site on every push to main.
# Repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
# Optional repo variables: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_GSC_TOKEN, VITE_CF_BEACON.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SITE_URL: https://dataforge.dataforge-learn.workers.dev
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_GSC_TOKEN: ${{ vars.VITE_GSC_TOKEN }}
      VITE_CF_BEACON: ${{ vars.VITE_CF_BEACON }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript type check
        run: npx tsc -b
      - name: Frontend unit & integration tests
        run: npx vitest run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: .
        run: pip install --quiet -r backend/requirements.txt && pytest backend/tests
      - name: Check Python examples and tasks
        working-directory: .
        run: python scripts/check_python_blocks.py
      - name: Prerender production site
        run: npm run build:site
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.157.0 deploy -c wrangler.jsonc
